name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  APP_DIR: notif-gateway
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ${{ github.repository }}
  GO_VERSION_FILE: go.mod

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Test
        run: go test ./...

      - name: Prepare image metadata
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY_LOWER="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REF=$REGISTRY/$IMAGE_REPOSITORY_LOWER" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          printf '%s\n' "$GH_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push Docker image
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "commit=${GITHUB_SHA}" \
            -t "${IMAGE_REF}:${GITHUB_SHA}" \
            -t "${IMAGE_REF}:latest" \
            .
          docker push "${IMAGE_REF}:${GITHUB_SHA}"
          docker push "${IMAGE_REF}:latest"

      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR'"
          scp -i ~/.ssh/deploy_key docker-compose.yml "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Activate release
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            APP_DIR="$APP_DIR" \
            REGISTRY="$REGISTRY" \
            IMAGE_REF="$IMAGE_REF" \
            RELEASE_SHA="$GITHUB_SHA" \
            GITHUB_ACTOR="$GITHUB_ACTOR" \
            GH_TOKEN="$GH_TOKEN" \
            'bash -se' <<'EOF'
          set -euo pipefail
          case "$APP_DIR" in
            /*) REMOTE_APP_DIR="$APP_DIR" ;;
            *) REMOTE_APP_DIR="$HOME/$APP_DIR" ;;
          esac

          if [ ! -f "$REMOTE_APP_DIR/.env" ]; then
            echo "$REMOTE_APP_DIR/.env is required on the server" >&2
            exit 1
          fi

          if docker info >/dev/null 2>&1; then
            DOCKER="docker"
          else
            DOCKER="sudo docker"
          fi

          printf '%s\n' "$GH_TOKEN" | $DOCKER login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

          cd "$REMOTE_APP_DIR"
          IMAGE_TAG="$IMAGE_REF:$RELEASE_SHA"
          TMP_ENV="$(mktemp)"
          awk -v image="$IMAGE_TAG" '
            BEGIN { replaced = 0 }
            /^NOTIF_IMAGE=/ {
              print "NOTIF_IMAGE=" image
              replaced = 1
              next
            }
            { print }
            END {
              if (replaced == 0) {
                print "NOTIF_IMAGE=" image
              }
            }
          ' .env > "$TMP_ENV"
          cat "$TMP_ENV" > .env
          rm -f "$TMP_ENV"

          for attempt in 1 2 3; do
            if $DOCKER pull "$IMAGE_TAG"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "image pull failed after 3 attempts" >&2
              df -h >&2 || true
              df -i >&2 || true
              $DOCKER system df >&2 || true
              exit 1
            fi
            echo "image pull failed (attempt $attempt/3), retrying..." >&2
            sleep 5
          done
          $DOCKER compose -f docker-compose.yml --profile migration run --rm migrate
          $DOCKER compose -f docker-compose.yml up -d api worker
          for service in api worker; do
            container_id="$($DOCKER compose -f docker-compose.yml ps -q "$service")"
            if [ -z "$container_id" ]; then
              echo "container for $service was not created" >&2
              $DOCKER compose -f docker-compose.yml logs --no-color --tail=100 "$service" >&2 || true
              exit 1
            fi
            if [ "$($DOCKER inspect -f '{{.State.Running}}' "$container_id")" != "true" ]; then
              echo "$service is not running after deploy" >&2
              $DOCKER compose -f docker-compose.yml logs --no-color --tail=100 "$service" >&2 || true
              exit 1
            fi
          done
          $DOCKER compose -f docker-compose.yml ps api worker

          $DOCKER image prune -f
          EOF
